[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipod-cli"
version = "0.1.0"
description = "Minimal iPod Classic song import/export tool. Trimmed from iOpenPod (MIT)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47.0,<2.0.0",
    "pillow>=11.0.0,<12.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pycryptodome>=3.20.0,<4.0.0",
    "tzdata>=2024.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
ipod = "ipod_cli.cli:main"
ipod-sync = "ipod_cli.sync_cli:main"
ipod-web = "ipod_web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iopenpod", "src/ipod_cli", "src/ipod_web"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 320
target-version = "py311"
extend-exclude = ["src/iopenpod"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入就是靠"函数调用写在参数默认值里"实现的
# （`ctx: WebContext = Depends(get_ctx)`），B008 在这里是系统性误报。
# FastAPI 官方文档也是这么建议的。
"src/ipod_web/**" = ["B008"]
